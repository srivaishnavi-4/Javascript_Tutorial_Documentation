<!DOCTYPE html>
<html>
<head>
    <title>Prototype</title>
</head>
<body>

<script>

    // Prototype
    const user = {
        name: "Vaishu"
    };

    console.log(
        Object.getPrototypeOf(user)
    );


    // Prototype Chain
    console.log(
        user.toString()
    );


    // __proto__
    const person = {
        name: "Vaishu"
    };

    console.log(person.__proto__);


    // Object.getPrototypeOf()
    console.log(
        Object.getPrototypeOf(person)
    );


    // Object.create()
    const userPrototype = {

        greet() {
            console.log("Hello Vaishu");
        }

    };

    const newUser =
        Object.create(userPrototype);

    newUser.greet();


    // Object.create(null)
    const data =
        Object.create(null);

    data.name = "Vaishu";

    console.log(data.name);


    // Constructor Function
    function User(name, age) {

        this.name = name;
        this.age = age;

    }

    const user1 =
        new User("Vaishu", 22);

    console.log(user1);


    // Constructor Function + Prototype Method
    User.prototype.greet = function() {

        console.log(
            `Hello ${this.name}`
        );

    };

    user1.greet();


    // constructor Property
    console.log(
        user1.constructor
    );


    // prototype vs __proto__
    console.log(User.prototype);
    console.log(user1.__proto__);


    // Classes use prototypes
    class Student {

        constructor(name) {
            this.name = name;
        }

        greet() {
            console.log(
                `Hello ${this.name}`
            );
        }

    }

    const student =
        new Student("Vaishu");

    student.greet();


    // Prototype Inheritance
    function Animal(name) {

        this.name = name;

    }

    Animal.prototype.eat = function() {

        console.log(
            `${this.name} is eating`
        );

    };


    function Dog(name) {

        Animal.call(this, name);

    }

    Dog.prototype =
        Object.create(Animal.prototype);

    Dog.prototype.constructor = Dog;

    const dog =
        new Dog("Tommy");

    dog.eat();

</script>

</body>
</html>

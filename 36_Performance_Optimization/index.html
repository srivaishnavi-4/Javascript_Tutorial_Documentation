<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">

    <title>Student Analytics Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        input {
            padding: 10px;
            width: 300px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
        }

        .student {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        #studentList {
            margin-top: 20px;
        }

        #performance {
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>Student Analytics Dashboard</h1>

    <!-- Search demonstrates debouncing -->
    <input
        id="search"
        type="text"
        placeholder="Search student..."
    >

    <p id="performance"></p>

    <div id="studentList"></div>

    <hr>

    <!-- Async loading / dynamic import -->
    <button id="loadAnalytics">
        Load Analytics
    </button>

    <p id="analyticsResult"></p>

    <hr>

    <!-- Web Worker -->
    <button id="runWorker">
        Run Heavy Calculation
    </button>

    <p id="workerResult"></p>

    <hr>

    <!-- requestAnimationFrame -->
    <button id="animate">
        Start Animation
    </button>

    <div
        id="box"
        style="
            width: 50px;
            height: 50px;
            background: black;
            position: relative;
        "
    ></div>

    <script
        type="module"
        src="./app.js"
    ></script>

</body>

</html>

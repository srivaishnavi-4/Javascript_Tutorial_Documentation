<!DOCTYPE html>
<html>
<head>
    <title>Student Profile System</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        input,
        select,
        button {
            padding: 8px;
            margin: 5px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h2>Student Profile System</h2>

    <label>Student Name:</label>
    <input
        type="text"
        id="name"
        placeholder="Enter student name"
    >

    <br><br>

    <label>Email:</label>
    <input
        type="text"
        id="email"
        placeholder="Enter email"
    >

    <br><br>

    <label>Department:</label>
    <input
        type="text"
        id="department"
        placeholder="Enter department"
    >

    <br><br>

    <label>Skills:</label>
    <input
        type="text"
        id="skills"
        placeholder="JavaScript, Java, Python"
    >

    <br><br>

    <label>Search Student:</label>
    <input
        type="text"
        id="search"
        placeholder="Search by name or skill"
    >

    <br><br>

    <button id="analyzeBtn">
        Analyze Profile
    </button>

    <button id="searchBtn">
        Search
    </button>

    <pre id="result"></pre>

    <script src="script.js"></script>

</body>
</html>

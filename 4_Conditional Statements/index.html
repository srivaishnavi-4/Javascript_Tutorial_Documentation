<!DOCTYPE html>
<html>
    <head>
        <title>
            Conditional Statements
        </title>
    </head>
    <body>
        <script>
            //if statement
            let mark = 75;
            if (mark >= 40) {
                console.log("Student has passed");
            }
            //else if
            let tmark = 85;
            if (tmark >= 90) {
                console.log("Grade A+");
            } else if (tmark >= 80) {
                console.log("Grade A");
            } else if (tmark >= 70) {
                console.log("Grade B");
            } else {
                console.log("Grade C");
            }
            //else statement
            let age = 16;
            if (age >= 18) {
                console.log("Eligible to vote");
            } else {
                console.log("Not eligible to vote");
            }
            //switch statement
            let choice = 2;
            switch (choice) {
                case 1:
                    console.log("Pizza");
                    break;
                case 2:
                    console.log("Burger");
                    break;
                case 3:
                    console.log("Pasta");
                    break;
                default:
                    console.log("Invalid choice");
            }
            //Ternary Operator
            let stock = 5;
            let message = stock > 0 ? "Product Available" : "Out of Stock";
            console.log(message);
        </script>
    </body>
</html>

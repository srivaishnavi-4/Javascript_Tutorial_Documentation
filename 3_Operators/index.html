<!DOCTYPE html>
<html>
    <head><title>Operators</title></head>
    <body style="font-size: 30px;">
        <script>
            //Arithmetic Operator
            let price = 500;
            let quantity = 3;
            let total = price * quantity;
            console.log("Total Price:", total);
            //Assignment Operator
            let balance = 5000;
            balance += 2000;
            console.log("Balance:", balance);
            //Comparison Operator
            let age = 20;
            console.log(age >= 18);
            //Logical Operators
            let username = "admin";
            let password = "1234";
            if (username === "admin" && password === "1234") {
                console.log("Login Successful");
            }
            //Bitwise Operators
            let permission = 5;
            let readPermission = 1;
            console.log(permission & readPermission);
            //Ternary Operator
            let stock = 10;
            let message = stock > 0 ? "Product Available" : "Out of Stock";
            console.log(message);
            
        </script>
    </body>
</html>

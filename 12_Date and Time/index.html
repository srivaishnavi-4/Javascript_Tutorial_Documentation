<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Tracker</title>

    <style>
        body {
            font-family: Arial;
            margin: 40px;
        }

        input, button {
            padding: 10px;
            margin: 5px;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #f4f4f4;
        }
    </style>
</head>

<body>

    <h2>Student Registration</h2>

    <input
        type="text"
        id="name"
        placeholder="Student Name"
    >

    <input
        type="date"
        id="dob"
    >

    <button id="registerBtn">
        Register Student
    </button>

    <div id="result"></div>

    <script src="script.js"></script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <title>Debugging POC</title>
</head>
<body>

    <h2>Shopping Cart</h2>

    <button onclick="calculateTotal()">
        Calculate Total
    </button>

    <p id="result"></p>

    <script>

        // Real-time shopping cart data
        const cart = [
            {
                name: "Laptop",
                price: 50000,
                quantity: 1
            },
            {
                name: "Mouse",
                price: 1000,
                quantity: 2
            }
        ];


        function calculateTotal() {

            let total = 0;

            // Inspect complete cart in DevTools
            console.table(cart);

            for (const item of cart) {

                // Breakpoint can also be placed here
                debugger;

                console.log("Processing item:", item.name);
                console.log("Price:", item.price);
                console.log("Quantity:", item.quantity);
                total += item.price * item.quantity;

                console.log("Current total:", total);
            }
            // Warning example
            if (total === 0) {
                console.warn("Cart is empty");
            }

            // Error example
            if (total < 0) {
                console.error("Invalid cart total");
            }


            document.getElementById("result").textContent =
                `Total: ₹${total}`;
        }

    </script>

</body>
</html>

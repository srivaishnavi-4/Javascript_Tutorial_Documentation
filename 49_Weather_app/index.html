<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Vaishu Weather App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <main class="weather-app">

        <header class="app-header">

            <h1>Weather App</h1>

            <p>
                Displays weather by mentioning the city name
            </p>

        </header>


        <section class="search-section">

            <div class="search-box">

                <input
                    type="text"
                    id="cityInput"
                    placeholder="Enter city name"
                    autocomplete="off"
                >

                <button id="searchButton">
                    Search
                </button>

            </div>


            <button
                id="locationButton"
                class="location-button"
            >
                Use My Location
            </button>

        </section>


        <p id="statusMessage"></p>


        <section
            id="weatherCard"
            class="weather-card hidden"
        >

            <div class="location-info">

                <h2 id="cityName">
                    --
                </h2>

                <p id="country">
                    --
                </p>

                <p id="dateTime">
                    --
                </p>

            </div>


            <div class="main-weather">

                <div class="weather-icon">

                    <span id="weatherEmoji">
                        --
                    </span>

                </div>


                <div>

                    <h3 id="temperature">
                        --°C
                    </h3>

                    <p id="description">
                        --
                    </p>

                </div>

            </div>


            <div class="weather-details">

                <div class="detail-card">

                    <span>
                        Feels Like
                    </span>

                    <strong id="feelsLike">
                        --°C
                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        Humidity
                    </span>

                    <strong id="humidity">
                        --%
                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        Wind Speed
                    </span>

                    <strong id="windSpeed">
                        -- km/h
                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        Pressure
                    </span>

                    <strong id="pressure">
                        -- hPa
                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        Minimum
                    </span>

                    <strong id="minTemperature">
                        --°C
                    </strong>

                </div>


                <div class="detail-card">

                    <span>
                        Maximum
                    </span>

                    <strong id="maxTemperature">
                        --°C
                    </strong>

                </div>

            </div>

        </section>


        <section
            id="emptyState"
            class="empty-state"
        >

            <p>
                Search for a city or use your current location.
            </p>

        </section>

    </main>


    <script src="app.js"></script>

</body>

</html>

<!DOCTYPE html>
<html>
<head>
    <title>Event Loop and Concurrency</title>
</head>
<body>

<script>

    // 1. Call Stack

    function first() {

        second();

    }


    function second() {

        console.log("Hello Vaishu");

    }


    first();


    // 2. Web APIs

    console.log("Start");


    setTimeout(() => {

        console.log("Timer finished");

    }, 2000);


    console.log("End");


    // 3. Task Queue

    console.log("A");


    setTimeout(() => {

        console.log("B");

    }, 0);


    console.log("C");


    // 4. Microtasks

    console.log("Start");


    Promise.resolve().then(() => {

        console.log("Promise");

    });


    console.log("End");


    // 5. Microtask vs Task Queue

    console.log("A");


    setTimeout(() => {

        console.log("B");

    }, 0);


    Promise.resolve().then(() => {

        console.log("C");

    });


    console.log("D");


    // 6. Event Loop

    console.log("Start");


    setTimeout(() => {

        console.log("Timeout");

    }, 0);


    Promise.resolve().then(() => {

        console.log("Promise");

    });


    console.log("End");


    // 7. Microtasks Example with async/await

    async function test() {

        console.log("B");

        await Promise.resolve();

        console.log("C");

    }


    console.log("A");

    test();

    console.log("D");


    // 8. Rendering

    document.body.textContent =
        "Hello Vaishu";


    // Heavy synchronous work can block rendering

    // for (let i = 0; i < 10000000000; i++) {
    //     // heavy work
    // }


    // 9. Complete Example

    console.log("1");


    setTimeout(() => {

        console.log("2 - Timer");

    }, 0);


    Promise.resolve().then(() => {

        console.log("3 - Promise");

    });


    console.log("4");


    // 10. Real-Time Example — Button Click + API

    const button = document.createElement("button");

    button.textContent = "Load Users";

    document.body.appendChild(button);


    button.addEventListener("click", async () => {

        console.log("Button clicked");


        try {

            const response =
                await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );


            const users =
                await response.json();


            console.log(users);

        } catch (error) {

            console.log(error.message);

        }

    });


    // 11. Call Stack vs Web APIs vs Queues

    console.log("Start");


    setTimeout(() => {

        console.log("Timeout");

    }, 0);


    Promise.resolve().then(() => {

        console.log("Promise");

    });


    console.log("End");

</script>

</body>
</html>

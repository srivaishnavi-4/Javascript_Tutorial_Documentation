<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Realtime Student Chat</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <div class="container">

        <h1>Realtime Student Chat</h1>

        <p class="subtitle">
            WebSocket + Socket.IO
        </p>


        <!-- Connection status -->

        <div id="status" class="status">
            Connecting...
        </div>


        <!-- Messages -->

        <div id="messages" class="messages">
        </div>


        <!-- Message form -->

        <form id="messageForm">

            <input
                id="studentName"
                type="text"
                placeholder="Your name"
                required
            >

            <input
                id="message"
                type="text"
                placeholder="Enter message"
                required
            >

            <button type="submit">
                Send
            </button>

        </form>

    </div>


    <!-- Socket.IO client library -->

    <script src="/socket.io/socket.io.js"></script>


    <script>

        // ==========================================
        // CONNECT TO SOCKET.IO SERVER
        // ==========================================

        const socket = io();


        // ==========================================
        // DOM ELEMENTS
        // ==========================================

        const status =
            document.querySelector("#status");

        const messages =
            document.querySelector("#messages");

        const form =
            document.querySelector("#messageForm");

        const studentName =
            document.querySelector("#studentName");

        const messageInput =
            document.querySelector("#message");


        // ==========================================
        // CONNECTION SUCCESS
        // ==========================================

        socket.on(
            "connect",
            function () {

                status.textContent =
                    "Connected to server";

            }
        );


        // ==========================================
        // CONNECTION LOST
        // ==========================================

        socket.on(
            "disconnect",
            function () {

                status.textContent =
                    " Disconnected from server";

            }
        );


        // ==========================================
        // SEND MESSAGE
        // ==========================================

        form.addEventListener(
            "submit",
            function (event) {

                // Prevent page refresh

                event.preventDefault();


                const name =
                    studentName.value.trim();

                const message =
                    messageInput.value.trim();


                if (
                    name === "" ||
                    message === ""
                ) {
                    return;
                }


                // Send data to server

                socket.emit(
                    "student-message",
                    {
                        name: name,
                        message: message
                    }
                );


                // Clear message input

                messageInput.value = "";

            }
        );


        // ==========================================
        // RECEIVE REALTIME MESSAGE
        // ==========================================

        socket.on(
            "student-message",
            function (data) {

                const messageElement =
                    document.createElement("div");


                messageElement.className =
                    "message";


                messageElement.innerHTML = `

                    <strong>
                        ${data.name}
                    </strong>

                    <p>
                        ${data.message}
                    </p>

                `;


                messages.appendChild(
                    messageElement
                );


                // Automatically scroll down

                messages.scrollTop =
                    messages.scrollHeight;

            }
        );

    </script>

</body>

</html>
